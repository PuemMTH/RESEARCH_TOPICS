<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typhoon Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #22222c;
    --border: #2e2e3a;
    --accent: #7c6aff;
    --accent-dim: #5a4fd4;
    --text: #e8e8f0;
    --text-dim: #8888a0;
    --user-bubble: #1e1e4a;
    --ai-bubble: #1a1a22;
    --code-bg: #111118;
    --green: #4ade80;
    --red: #f87171;
  }

  body {
    font-family: 'Sarabun', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    border-radius: 10px;
    display: grid; place-items: center;
    font-size: 18px; font-weight: 700; color: #fff;
  }

  .header-title { flex: 1; }
  .header-title h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.02em; }
  .header-title p  { font-size: 12px; color: var(--text-dim); margin-top: 1px; }

  .model-select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    outline: none;
    min-width: 180px;
  }
  .model-select:focus { border-color: var(--accent); }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s;
  }
  .status-dot.ok  { background: var(--green); }
  .status-dot.err { background: var(--red); }

  /* ── System prompt bar ── */
  .system-bar {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 6px 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .system-bar label { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .system-input {
    flex: 1;
    background: none;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    outline: none;
  }
  .system-input::placeholder { color: var(--text-dim); }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg-row {
    display: flex;
    gap: 12px;
    padding: 6px 20px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
  }
  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg-row.user .avatar { background: var(--accent-dim); }
  .msg-row.ai   .avatar { background: var(--surface2); border: 1px solid var(--border); }

  .bubble {
    max-width: calc(100% - 56px);
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg-row.user .bubble {
    background: var(--user-bubble);
    border: 1px solid #2a2a6a;
    border-radius: 14px 4px 14px 14px;
  }
  .msg-row.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--border);
    border-radius: 4px 14px 14px 14px;
  }

  .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--text-dim);
  }
  .empty-state .big-logo {
    font-size: 48px;
    background: linear-gradient(135deg, var(--accent), #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
  }
  .empty-state p { font-size: 14px; }

  /* ── Input bar ── */
  .input-bar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 14px 20px;
    flex-shrink: 0;
  }
  .input-wrap {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #user-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    resize: none;
    min-height: 50px;
    max-height: 200px;
    outline: none;
    line-height: 1.5;
    transition: border-color 0.2s;
  }
  #user-input:focus { border-color: var(--accent); }
  #user-input::placeholder { color: var(--text-dim); }

  .btn-send {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    width: 46px; height: 46px;
    display: grid; place-items: center;
    cursor: pointer;
    color: #fff;
    font-size: 18px;
    transition: background 0.2s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn-send:hover:not(:disabled) { background: var(--accent-dim); }
  .btn-send:active:not(:disabled) { transform: scale(0.95); }
  .btn-send:disabled { background: var(--border); cursor: not-allowed; }

  .btn-clear {
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    height: 46px;
    padding: 0 14px;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    flex-shrink: 0;
  }
  .btn-clear:hover { border-color: var(--text-dim); color: var(--text); }

  .hint { font-size: 11px; color: var(--text-dim); text-align: center; margin-top: 8px; }

  /* temperature slider */
  .temp-wrap { display: flex; align-items: center; gap: 8px; }
  .temp-wrap label { font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  input[type=range] { width: 80px; accent-color: var(--accent); }
  #temp-val { font-size: 12px; color: var(--text); min-width: 28px; }
</style>
</head>
<body>

<header>
  <div class="logo">T</div>
  <div class="header-title">
    <h1>Typhoon Chat</h1>
    <p>scb10x/llama-3-typhoon-v1.5-8b-instruct</p>
  </div>

  <div class="temp-wrap">
    <label>temp</label>
    <input type="range" id="temp-slider" min="0" max="2" step="0.05" value="0.7">
    <span id="temp-val">0.7</span>
  </div>

  <select class="model-select" id="model-select">
    <option value="typhoon">typhoon</option>
  </select>

  <div class="status-dot" id="status-dot" title="Ollama status"></div>
</header>

<div class="system-bar">
  <label>SYSTEM</label>
  <input class="system-input" id="system-prompt"
    placeholder="Custom system prompt (optional)…"
    value="You are Typhoon, a helpful AI assistant fluent in Thai and English. Respond in the same language the user uses.">
</div>

<div id="messages">
  <div class="empty-state" id="empty-state">
    <div class="big-logo">T</div>
    <p>พิมพ์ข้อความเพื่อเริ่มสนทนา</p>
    <p style="font-size:12px">Typhoon รองรับทั้งภาษาไทยและภาษาอังกฤษ</p>
  </div>
</div>

<div class="input-bar">
  <div class="input-wrap">
    <button class="btn-clear" id="btn-clear">ล้าง</button>
    <textarea id="user-input" rows="1" placeholder="พิมพ์ข้อความ… (Enter ส่ง, Shift+Enter ขึ้นบรรทัดใหม่)"></textarea>
    <button class="btn-send" id="btn-send" title="Send">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
  <div class="hint">Enter = ส่ง &nbsp;·&nbsp; Shift+Enter = ขึ้นบรรทัด</div>
</div>

<script>
const msgsEl = document.getElementById('messages');
const emptyEl = document.getElementById('empty-state');
const inputEl = document.getElementById('user-input');
const sendBtn = document.getElementById('btn-send');
const clearBtn = document.getElementById('btn-clear');
const modelSel = document.getElementById('model-select');
const statusDot = document.getElementById('status-dot');
const systemEl = document.getElementById('system-prompt');
const tempSlider = document.getElementById('temp-slider');
const tempVal = document.getElementById('temp-val');

let history = [];   // [{role, content}]
let streaming = false;
let abortCtrl = null;

// ── Temp slider ──
tempSlider.addEventListener('input', () => {
  tempVal.textContent = parseFloat(tempSlider.value).toFixed(2);
});

// ── Load models ──
async function loadModels() {
  try {
    const r = await fetch('/api/models');
    const d = await r.json();
    if (d.models && d.models.length) {
      modelSel.innerHTML = '';
      d.models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = m;
        if (m === 'typhoon') opt.selected = true;
        modelSel.appendChild(opt);
      });
    }
    statusDot.className = 'status-dot ok';
  } catch {
    statusDot.className = 'status-dot err';
  }
}
loadModels();
setInterval(async () => {
  try {
    const r = await fetch('/api/health');
    const d = await r.json();
    statusDot.className = 'status-dot ' + (d.status === 'ok' ? 'ok' : 'err');
  } catch { statusDot.className = 'status-dot err'; }
}, 15000);

// ── Auto-resize textarea ──
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
});

// ── Key handler ──
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!streaming) sendMessage();
  }
});

sendBtn.addEventListener('click', () => {
  if (streaming) { stopGeneration(); } else { sendMessage(); }
});
clearBtn.addEventListener('click', clearChat);

function clearChat() {
  history = [];
  msgsEl.innerHTML = '';
  msgsEl.appendChild(emptyEl);
  emptyEl.style.display = 'flex';
}

function appendMsg(role, content = '') {
  if (emptyEl.style.display !== 'none') emptyEl.style.display = 'none';

  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = role === 'user' ? '👤' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;

  row.appendChild(av);
  row.appendChild(bubble);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return bubble;
}

function addCursor(bubble) {
  const c = document.createElement('span');
  c.className = 'cursor';
  bubble.appendChild(c);
  return c;
}

function stopGeneration() {
  if (abortCtrl) abortCtrl.abort();
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';

  history.push({ role: 'user', content: text });
  appendMsg('user', text);

  const aiBubble = appendMsg('ai', '');
  const cursor = addCursor(aiBubble);

  setStreaming(true);
  abortCtrl = new AbortController();

  const payload = {
    messages: history,
    model: modelSel.value,
    temperature: parseFloat(tempSlider.value),
    system: systemEl.value.trim() || null,
  };

  let fullText = '';
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: abortCtrl.signal,
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') break;
        try {
          const obj = JSON.parse(raw);
          if (obj.error) { aiBubble.textContent += '\n[Error: ' + obj.error + ']'; break; }
          const token = obj.message?.content ?? '';
          fullText += token;
          aiBubble.textContent = fullText;
          aiBubble.appendChild(cursor);
          msgsEl.scrollTop = msgsEl.scrollHeight;
        } catch {}
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      aiBubble.textContent += fullText ? '\n[Connection error]' : '[Error connecting to server]';
    }
  }

  cursor.remove();
  if (fullText) history.push({ role: 'assistant', content: fullText });
  setStreaming(false);
}

function setStreaming(on) {
  streaming = on;
  inputEl.disabled = on;
  sendBtn.innerHTML = on
    ? '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
    : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>';
  sendBtn.title = on ? 'Stop' : 'Send';
  if (!on) inputEl.focus();
}
</script>
</body>
</html>
