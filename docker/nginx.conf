server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    # No SPA fallback — this is a flat file repo, not an app.
    # Directory listing helps when browsing papers/ or docs/ without an index.html.
    autoindex on;

    location / {
        try_files $uri $uri/ =404;
    }

    # Don't serve dotfiles/dotdirs (.git, .claude, .omc) over HTTP.
    location ~ /\. {
        deny all;
    }

    types {
        text/html                html htm;
        text/css                 css;
        application/javascript   js;
        application/pdf          pdf;
        application/json         json;
        image/png                png;
        image/jpeg                jpg jpeg;
        image/svg+xml            svg;
    }
}
