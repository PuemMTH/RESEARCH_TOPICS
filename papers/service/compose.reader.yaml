services:
  papers-reader:
    image: nginx:alpine
    container_name: papers-reader
    volumes:
      - ../:/usr/share/nginx/html:ro
    command: >
      sh -c "printf 'server {\n  listen 80;\n  root /usr/share/nginx/html;\n  autoindex on;\n  autoindex_exact_size off;\n  autoindex_localtime on;\n  charset utf-8;\n  location ~\\.pdf$ { add_header Content-Disposition inline; }\n}' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    labels:
      proxy.enable: "true"
      proxy.host: "papers.${DOMAIN:-sir-labs.com}"
    restart: unless-stopped
